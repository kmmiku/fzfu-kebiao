name: 福外课表日报

on:
  schedule:
    # UTC 22:00 = 北京时间 06:00, 每天
    - cron: '0 22 * * *'
  workflow_dispatch: {}   # 支持仓库页面手动触发

permissions:
  contents: write

jobs:
  fetch-kebiao:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 抓取课表并生成 ICS
        env:
          KEBIAO_USER: ${{ secrets.KEBIAO_USER }}    # 学号
          KEBIAO_PASS: ${{ secrets.KEBIAO_PASS }}    # 密码
        run: python kebiao.py

      - name: 发布到 gh-pages (https://用户名.github.io/仓库名/kebiao.ics)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: .
          force_orphan: true
          user_name: 'kebiao-bot'
          user_email: 'kebiao-bot@users.noreply.github.com'
          # 隐私保护: kebiao.json 含学生姓名/学号/班级 — 绝不发布; 其余为本地产物
          exclude_assets: '.github, .gitignore, secret.txt, kebiao.json, run_log.txt, probe, __pycache__'